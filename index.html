<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>ClickTheBall🏀</title>
    <style>
    .high-score {
        position: fixed;
        bottom: 20px;
        left: 2%;
        font-size: 16px;
        padding: 10px 15px;
        color: #ff6b35;
        font-weight: bold;
        margin: 20px 0;
        text-shadow: 0 0 10px rgba(255, 235, 59, 0.5);
        box-shadow: 0 8px 0 #000, 0 15px 30px rgba(255, 235, 59, 0.4);
        border-radius: 15px;  
        border: 4px solid #000;
        display: inline-block;
        overflow: hidden;
        max-width: 45%;
        background: linear-gradient(90deg, transparent 0%, #000000 50%, transparent 100%);
    }
    .PlayersName{
      position:fixed;
      top: 15px ;
      right: 2%;
      font-size: 16px;
      padding: 10px 15px;
      color: #ff6b35;
      font-weight: bold;
      margin: 20px 0;
      text-shadow: 0 0 10px rgba(255, 107, 53, 0.5);
      box-shadow: 0 8px 0 #000, 0 15px 30px rgba(247, 147, 30, 0.4);
      border-radius: 15px;  
      border: 4px solid #000;
      display: inline-block;
      overflow: hidden;
      background:linear-gradient(90deg, transparent 0%, #000000 50%, transparent 100%);
      max-width: 45%;
      word-wrap: break-word;  

    }
    .game{
        background: transparent;  /* no white background */
        border: none;             /* remove border */
        cursor: pointer;          /* optional: pointer on hover */
        position: fixed;
        font-size: 80px;
        animation: float 3s infinite ease-in-out;
        opacity: 1;
        z-index: 9999;
    }
    .restar{
      background: linear-gradient(90deg, transparent 0%, #000000 50%, transparent 100%);
      position:fixed;
      bottom: 20px;
      left:50%;
      transform: translateX(-50%);
      font-size: 14px;
      padding: 12px 10px;
      font-weight: bold;
      color: #ff6b35;
      margin: 20px 0;
      padding: 20px 15px;
      font-weight: 900;
      overflow: hidden;
      border: 4px solid #000;
      border-radius: 50%;
      box-shadow: 0 8px 0 #000, 0 15px 30px rgba(247, 147, 30, 0.4);
    }
    .restar::after {
     content: '';
     position: absolute;
     top: 0;
     left: -100%;  /* Commence caché à gauche */
     width: 100%;
     height: 100%;
     background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
     transition: left 0.6s;
    }

   .restar:hover::after {
    left: 100%;  /* Glisse vers la droite au hover */
    }
    .timer{
      position: fixed;
      top:15px;
      left: 2%;
      color: #ff6b35; 
      font-weight: bold;
      margin: 20px 0;
      text-shadow: 0 0 10px rgba(255, 107, 53, 0.5);
      overflow: hidden;
      border: 4px solid #000;
      border-radius: 15px;
      box-shadow: 0 8px 0 #000, 0 15px 30px rgba(247, 147, 30, 0.4);
      background: linear-gradient(90deg, transparent 0%, #000000 50%, transparent 100%);
      padding: 10px 15px;
      font-size: 16px;
    }
    .message {
      position: fixed;
      top: 240px;
      left: 50%;
      transform: translateX(-50%);
      font-family: "Press Start 2P", cursive;
      font-size: 50px;
      color: #ff6b35;
      letter-spacing: 3px;
      text-transform: uppercase;
      animation: glitch 1s infinite;
   }

   @keyframes glitch {
     0% { text-shadow: 2px 0 red, -2px 0 blue; }
     20% { text-shadow: -2px 0 red, 2px 0 blue; }
     40% { text-shadow: 2px 2px red, -2px -2px blue; }
     60% { text-shadow: -2px -2px red, 2px 2px blue; }
     80% { text-shadow: 2px -2px red, -2px 2px blue; }
     100% { text-shadow: -2px 2px red, 2px -2px blue; }
  }
    .fade-out {
    opacity: 0;
    transition: opacity 0.6s ease;
    }

    .fade-in {
      animation: fadeIn 0.6s ease;
    }     
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes Glow {
    0%, 100% {
        color: #ffeb3b;
        text-shadow: 0 0 10px rgba(255, 235, 59, 0.5);
        box-shadow: 0 8px 0 #000, 0 15px 30px rgba(255, 235, 59, 0.4);
    }
    50% {
        color: #ffff00;
        text-shadow: 0 0 20px rgba(255, 235, 59, 1);
        box-shadow: 0 8px 0 #000, 0 15px 40px rgba(255, 235, 59, 0.8);
    }
  }
  .resetScore{
      position: fixed;
      bottom:20px;
      right: 2%;
      color: #ff6b35; 
      font-weight: bold;
      margin: 20px 0;
      text-shadow: 0 0 10px rgba(255, 107, 53, 0.5);
      overflow: hidden;
      border: 4px solid #000;
      border-radius: 15px;
      box-shadow: 0 8px 0 #000, 0 15px 30px rgba(247, 147, 30, 0.4);
      background: linear-gradient(90deg, transparent 0%, #000000 50%, transparent 100%);
      padding: 10px 15px;
      font-size: 14px;
      max-width: 45%;
      white-space: nowrap;
  }
  </style>  
</head>
<body>
    <div class="floating-ball ball-1">🏀</div>
    <div class="floating-ball ball-2">🏀</div>
    <div class="floating-ball ball-3">🏀</div>
    <div class="floating-ball ball-4">🏀</div>
    <div class="court-lines">
        <div class="center-circle"></div>
        <div class="center-line"></div>
        <div class="three-point-left"></div>
        <div class="three-point-right"></div>
    </div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="score-display">Score:0</div> 
    <div class="adjust"> 
        <button  id="startBtn" class="btn2" onclick="switchBoutton()">click to start</button>
        <br><br>
        <input id="label" type="text" placeholder="Player's Name" class="name" ></input>
    </div>
    <script src="script.js"></script>  
</body>
</html>
